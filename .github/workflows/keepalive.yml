name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "${{ vars.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -o /dev/null
