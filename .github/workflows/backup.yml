name: Nightly Supabase backup

on:
  # Paused until SUPABASE_DB_URL is set up (Phase 9) -- it was failing every
  # night with no connection string to dump from. Re-enable the schedule once
  # that secret exists; workflow_dispatch still works for a manual test run.
  # schedule:
  #   - cron: '0 2 * * *' # every day, 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges -Fc \
            -f "backup-$(date +%Y-%m-%d).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 30
